<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Nilainya disetel ulang oleh theme.js: pilihan manual di Pengaturan bisa
       berbeda dari preferensi sistem, jadi tidak bisa diserahkan ke media query. -->
  <meta name="theme-color" content="#eef4ff" />
  <meta name="description" content="Pembukuan dan dashboard keuangan dari e-statement bank. Data tersimpan di perangkat Anda sendiri." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Pembukuan" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon-192.png" />
  <title>Pembukuan &amp; Dashboard Keuangan</title>

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/print.css" />

  <script>
    /* Tema diterapkan sebelum halaman digambar supaya tidak ada kedipan putih
       ketika aplikasi dibuka dalam mode gelap. */
    (function () {
      try {
        var t = localStorage.getItem('pembukuan_tema');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* mode penyamaran memblokir localStorage */ }
    })();
  </script>
</head>
<body>
  <div class="app" id="app">
    <main class="utama">
      <div class="halaman">
        <div class="kartu dv__kosong" id="memuat">
          <strong>Memuat aplikasi…</strong>
          <div class="redup-2">Kalau layar ini tidak berganti, aktifkan JavaScript di browser Anda.</div>
        </div>
      </div>
    </main>
  </div>

  <noscript>
    <div class="kartu" style="margin:16px">
      <strong>JavaScript dimatikan.</strong>
      <p class="redup">Aplikasi ini memproses e-statement langsung di perangkat Anda, jadi memerlukan JavaScript.</p>
    </div>
  </noscript>

  <script>
    /* Penjaga: bila modul aplikasi gagal dimuat (biasanya cache berisi campuran
       berkas versi lama dan baru), tawarkan pembersihan cache alih-alih
       "Memuat aplikasi…" selamanya. Yang dihapus hanya cache berkas aplikasi;
       data pembukuan (IndexedDB) tidak disentuh. */
    setTimeout(function () {
      var el = document.getElementById('memuat');
      if (!el) return;
      el.innerHTML = '<strong>Aplikasi gagal dimuat.</strong>'
        + '<div class="redup-2">Biasanya karena berkas versi lama tersimpan di cache. '
        + 'Data pembukuan Anda tidak terpengaruh.</div>'
        + '<button type="button" class="btn-primary" style="margin-top:12px" id="muat-bersih">Bersihkan cache &amp; muat ulang</button>';
      document.getElementById('muat-bersih').onclick = function () {
        /* Unduh ulang paksa setiap berkas yang tadi dicoba dimuat: reload biasa
           tetap memakai cache HTTP browser untuk modul, dan justru itu yang basi. */
        var tugas = performance.getEntriesByType('resource')
          .filter(function (r) { return r.name.indexOf(location.origin) === 0; })
          .map(function (r) { return fetch(r.name, { cache: 'reload' }).catch(function () {}); });
        if (window.caches) {
          tugas.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
        }
        if (navigator.serviceWorker) {
          tugas.push(navigator.serviceWorker.getRegistrations().then(function (r) {
            return Promise.all(r.map(function (x) { return x.update().catch(function () {}); }));
          }));
        }
        Promise.all(tugas).catch(function () {}).then(function () { location.reload(); });
      };
    }, 8000);
  </script>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
